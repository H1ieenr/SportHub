@if (alertService.alert(); as alert) {
  <div
    class="alert alert-dismissible fade show d-flex align-items-center gap-2"
    [class.alert-success]="alert.type === 'success'"
    [class.alert-danger]="alert.type === 'danger'"
    [class.alert-warning]="alert.type === 'warning'"
    role="alert"
  >
    <i antIcon [type]="getIconType(alert.type)" theme="fill"></i>
    <span>{{ alert.message }}</span>

    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="alertService.clear()"
    ></button>
  </div>
}
