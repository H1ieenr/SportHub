@if (totalPages() > 0) {
  <div class="app-pagination">
    <span class="app-pagination__range">{{ rangeText() }}</span>

    <nav>
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="!hasPreviousPage()">
          <button class="page-link" type="button" [disabled]="!hasPreviousPage()" aria-label="Trang trước" (click)="onPrevious()">‹</button>
        </li>

        @for (page of pages(); track page) {
          <li class="page-item" [class.active]="page === pageNumber()">
            <button class="page-link" type="button" [attr.aria-current]="page === pageNumber() ? 'page' : null" (click)="onGoTo(page)">{{ page }}</button>
          </li>
        }

        <li class="page-item" [class.disabled]="!hasNextPage()">
          <button class="page-link" type="button" [disabled]="!hasNextPage()" aria-label="Trang sau" (click)="onNext()">›</button>
        </li>
      </ul>
    </nav>
  </div>
}
