<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" (click)="onCancel()"></button>
</div>

<div class="modal-body">
  <p class="mb-0">{{ message }}</p>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" (click)="onCancel()">
    <i antIcon type="close-circle" theme="outline"></i>
    <span>{{ cancelText }}</span>
  </button>
  <button type="button" class="btn btn-danger d-inline-flex align-items-center gap-2" (click)="onConfirm()">
    <i antIcon type="delete" theme="fill"></i>
    <span>{{ confirmText }}</span>
  </button>
</div>
